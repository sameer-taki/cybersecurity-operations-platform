services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cyberops
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cyberops"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
  redis:
    image: redis:7.4.5-alpine
    ports: ["6379:6379"]
  migrate:
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["uv", "run", "alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+asyncpg://app_runtime:app_runtime@postgres:5432/cyberops
      DDL_DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/cyberops
      JWT_SECRET: development-only-secret
      TOTP_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: cyberops-raw
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres: {condition: service_healthy}
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://app_runtime:app_runtime@postgres:5432/cyberops
      DDL_DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/cyberops
      JWT_SECRET: development-only-secret
      TOTP_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: cyberops-raw
      REDIS_URL: redis://redis:6379/0
    ports: ["8000:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
  seed:
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["uv", "run", "python", "-m", "app.seed"]
    environment:
      DATABASE_URL: postgresql+asyncpg://app_runtime:app_runtime@postgres:5432/cyberops
      DDL_DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/cyberops
      JWT_SECRET: development-only-secret
      TOTP_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: cyberops-raw
      REDIS_URL: redis://redis:6379/0
    depends_on:
      migrate: {condition: service_completed_successfully}
